<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mitarbeiterbereich – StagePulse Events</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-body"><header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i></span><span>STAGEPULSE<span class="brand-light"> EVENTS</span></span></a><span>INTERNER BEREICH</span></header>
<main class="admin-main"><section id="login-panel" class="login-panel"><div class="section-kicker">GESCHÜTZTER ZUGANG</div><h1>Mitarbeiter-<br><span>Login.</span></h1><p>Bitte melde dich mit deinem persönlichen Zugang an.</p><form id="login-form"><label>E-Mail-Adresse<input type="email" name="email" required autocomplete="username"></label><label>Passwort<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Anmelden ↗</button><p id="login-error" class="admin-error" role="alert"></p></form><a href="index.html" class="back-link">← Zurück zur Website</a></section>
<section id="dashboard" hidden><div class="dashboard-top"><div><div class="section-kicker">STAGEPULSE / VERWALTUNG</div><h1>Anfragen<span>.</span></h1><p id="user-label"></p></div><button id="logout" class="button button-ghost">Abmelden</button></div><div class="dashboard-controls"><input id="search" placeholder="Name, Ort oder E-Mail suchen …"><select id="status-filter"><option value="">Alle Status</option><option>Neu</option><option>Angenommen</option><option>In Bearbeitung</option><option>Abgeschlossen</option><option>Abgelehnt</option></select><button id="refresh" class="button button-ghost">↻ Aktualisieren</button></div><div id="request-list" class="request-list"></div><p id="dashboard-error" class="admin-error"></p><section id="employee-panel" class="employee-panel" hidden><h2>Mitarbeiter einladen</h2><form id="invite-form"><input type="email" name="email" placeholder="Mitarbeiter-E-Mail" required><button class="button button-primary">Einladung senden</button></form><p id="invite-message"></p><h3>Team-Zugänge</h3><div id="employee-list" class="employee-list"></div></section></section></main>
<dialog id="request-dialog"><div class="request-dialog-content"><button id="close-request" class="dialog-close">×</button><div class="section-kicker">ANFRAGEDETAILS</div><h2 id="detail-name"></h2><div id="detail-body"></div><label class="note-label">Interne Notiz<textarea id="internal-note" rows="3" placeholder="Nur für das Team sichtbar …"></textarea></label><button id="save-note" class="button button-ghost">Notiz speichern</button><div id="note-list"></div></div></dialog>
</body></html>
